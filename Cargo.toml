[package]
authors = ["Alison Oliveira <arobsn@proton.me>"]
edition = "2024"
name = "hergmes"
version = "0.1.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hergmes"
path = "src/main.rs"

# The relay over a simulated chain, for the client SDK's tests.
[[bin]]
name = "sim-relay"
path = "src/bin/sim-relay.rs"
required-features = ["sim"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "ws"] }
base64 = "0.23.1"
blake2 = "0.11.0"
bs58 = "0.5.1"
hex = "0.4.3"
moka = { version = "0.12.16", features = ["future", "sync"] }
proptest = { version = "1.12.0", optional = true }
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", default-features = false }
tower-http = { version = "0.7.1", features = ["cors"] }
# The version axum's `ws` uses, to tell an oversize message from other read errors.
tungstenite = { version = "0.29.0", default-features = false }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
prometheus-client = "0.26.0"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }

[features]
# Exposes the `sim` module (SimChain + oracle) to integration tests and the `sim-relay` binary.
sim = ["dep:proptest"]

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
http-body-util = "0.1.5"
proptest = "1.12.0"
proptest-state-machine = "0.9.0"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
